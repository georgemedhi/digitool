<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Advanced Image Processor - Compress & Convert Images">
    <title>Image Processor | DigitalHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #8A2BE2;
            --secondary: #4B0082;
            --accent: #FF69B4;
            --dark: #1A1A1A;
            --text: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 70%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .upload-section {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            margin: 2rem 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            background: rgba(138, 43, 226, 0.1);
        }

        .file-list {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            margin: 0.5rem 0;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .control-card {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--primary);
            margin: 1rem 0;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-section" id="dropZone">
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
            <label for="fileInput" style="cursor: pointer;">
                <i class="fas fa-cloud-upload-alt fa-3x"></i>
                <h2>Drag & Drop or Click to Upload Images</h2>
                <p>Supports JPEG, PNG, WEBP (Max 10MB each)</p>
            </label>
        </div>

        <div class="file-list" id="fileList">
            <!-- Selected files will appear here -->
        </div>

        <div class="controls-grid">
            <!-- Compression Card -->
            <div class="control-card">
                <h3><i class="fas fa-compress"></i> Compression</h3>
                <label>Quality: <span id="qualityValue">80</span>%</label>
                <input type="range" id="quality" min="1" max="100" value="80">
            </div>

            <!-- Convert Card -->
            <div class="control-card">
                <h3><i class="fas fa-file-export"></i> Convert Format</h3>
                <select id="format" style="width: 100%; padding: 0.5rem; margin-top: 1rem;">
                    <option value="original">Original Format</option>
                    <option value="jpeg">JPEG</option>
                    <option value="png">PNG</option>
                    <option value="webp">WEBP</option>
                </select>
            </div>
        </div>

        <div style="text-align: center; margin: 2rem 0;">
            <button onclick="processImages()"><i class="fas fa-magic"></i> Process Images</button>
        </div>

        <div id="output">
            <!-- Processed images will appear here -->
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const quality = document.getElementById('quality');
        const qualityValue = document.getElementById('qualityValue');
        const format = document.getElementById('format');

        // Update quality display
        quality.addEventListener('input', () => {
            qualityValue.textContent = quality.value;
        });

        // Handle file selection
        fileInput.addEventListener('change', updateFileList);
        
        // Drag and drop handlers
        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = 'rgba(138, 43, 226, 0.1)';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.backgroundColor = 'transparent';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = 'transparent';
            fileInput.files = e.dataTransfer.files;
            updateFileList();
        });

        function updateFileList() {
            fileList.innerHTML = '';
            Array.from(fileInput.files).forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <i class="fas fa-file-image" style="margin-right: 1rem;"></i>
                    ${file.name} (${(file.size/1024).toFixed(1)}KB)
                `;
                fileList.appendChild(item);
            });
        }

        async function processImages() {
            const files = Array.from(fileInput.files);
            if (files.length === 0) {
                alert('Please select at least one image!');
                return;
            }

            for (const file of files) {
                const reader = new FileReader();
                reader.onload = (e) => processImage(file, e.target.result);
                reader.readAsDataURL(file);
            }
        }

        function processImage(originalFile, dataUrl) {
            const img = new Image();
            img.src = dataUrl;

            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // Maintain original dimensions
                canvas.width = img.width;
                canvas.height = img.height;

                // Draw image
                ctx.drawImage(img, 0, 0);

                // Get output format
                const outputFormat = format.value === 'original' 
                    ? originalFile.type.split('/')[1] 
                    : format.value;

                // Convert to blob
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    showResult(originalFile, blob, url, outputFormat);
                }, `image/${outputFormat}`, quality.value/100);
            };
        }

        function showResult(originalFile, processedBlob, url, format) {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'file-item';
            resultDiv.style.margin = '1rem 0';
            resultDiv.innerHTML = `
                <div style="display: flex; gap: 2rem; align-items: center;">
                    <div>
                        <img src="${url}" style="width: 100px; height: auto; border-radius: 6px;">
                    </div>
                    <div>
                        <p>Original: ${(originalFile.size/1024).toFixed(1)}KB</p>
                        <p>Processed: ${(processedBlob.size/1024).toFixed(1)}KB</p>
                        <p>Reduction: ${((1 - processedBlob.size/originalFile.size)*100).toFixed(1)}%</p>
                        <a href="${url}" download="processed.${format}" style="color: var(--accent);">
                            <i class="fas fa-download"></i> Download
                        </a>
                    </div>
                </div>
            `;
            document.getElementById('output').appendChild(resultDiv);
        }
    </script>
</body>
</html>
